name: .NET CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: ./first
        run: dotnet restore practice2026.slnx
        
      - name: Build
        working-directory: ./first
        run: dotnet build practice2026.slnx --configuration Release --no-restore
        
      - name: Test
        working-directory: ./first
        run: dotnet test practice2026.slnx --no-build --verbosity normal
